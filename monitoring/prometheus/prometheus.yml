global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "nekohentai-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:5000", "api:5000"]
        labels:
          app: "nekohentai-backend"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
