events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate Limiting Zones (Anti-Scraper & DDoS Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=read_limit:10m rate=10r/s;
    limit_req_status 429;

    # Bad Bot & Scraper User-Agent Blocker Map
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?i)(scrapy|python-requests|bytespider|wget|sqlmap|nikto|masscan|httpx|postmanruntime|aiohttp|urllib) 1;
    }

    upstream api_backend {
        server api:5000;
    }

    upstream frontend_app {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _ localhost nekohentai.lol www.nekohentai.lol nekohentai.com www.nekohentai.com nekohentai.site www.nekohentai.site hypermmo.site www.hypermmo.site;

        # Block Known Malicious Bot Scrapers
        if ($bad_bot = 1) {
            return 403 '{"status": 403, "error": "Forbidden", "message": "Truy cập bị từ chối do phát hiện công cụ cào tự động."}';
        }

        # Gzip compression for faster loading
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        # Rate Limiting for Chapter Reading API (10 req/s, burst 20)
        location ~ ^/api/(chapters|comics/.+/chapters) {
            limit_req zone=read_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SEO Sitemap & Robots.txt Direct Routing
        location = /sitemap.xml {
            proxy_pass http://api_backend/api/seo/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /robots.txt {
            proxy_pass http://api_backend/api/seo/robots.txt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger Documentation
        location /swagger/ {
            proxy_pass http://api_backend/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check Endpoint
        location /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rate Limiting for General API (30 req/s, burst 50)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Angular Frontend SPA Routing (Fallback)
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
