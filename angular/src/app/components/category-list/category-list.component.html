<div class="content category-page">
  <div class="div_middle">
    <!-- Breadcrumb -->
    <ol class="breadcrumb">
      <li>
        <a routerLink="/"><i class="fa fa-home"></i> <span>Trang Chủ</span></a>
      </li>
      <li>
        <span class="active">Thể Loại Truyện</span>
      </li>
    </ol>

    <div class="main_content">
      <div class="section-heading">
        <h1 class="text_list_update">
          <i class="fa fa-th-large"></i> TẤT CẢ THỂ LOẠI TRUYỆN
        </h1>
      </div>

      <div class="category-grid" *ngIf="!isLoading; else catSkeleton">
        <a *ngFor="let cat of categories" [routerLink]="['/comics']" [queryParams]="{ category: cat.slug }" class="truyengg-category-card">
          <div class="cat-header">
            <h3>{{ cat.name }}</h3>
            <span class="count">{{ cat.comicCount }} truyện</span>
          </div>
          <p class="desc">{{ cat.description || 'Truyện thuộc thể loại ' + cat.name + ' chọn lọc hấp dẫn.' }}</p>
          <div class="cat-footer">
            <span>Khám phá <i class="fa fa-angle-right"></i></span>
          </div>
        </a>
      </div>

      <ng-template #catSkeleton>
        <div class="category-grid">
          <div class="truyengg-category-card skeleton-card" *ngFor="let _ of skeletonCategories">
            <div class="skeleton skeleton-title" style="width: 60%; height: 20px; margin-bottom: 10px;"></div>
            <div class="skeleton skeleton-text" style="width: 90%;"></div>
            <div class="skeleton skeleton-text" style="width: 50%;"></div>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</div>
