<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cute Chibi Black Fur (Midnight Charcoal) -->
    <linearGradient id="chibiFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3345" />
      <stop offset="50%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0c0f18" />
    </linearGradient>

    <!-- Kawaii Pink Inner Ear Gradient -->
    <linearGradient id="chibiPinkEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Sparkling Anime Eye Gradient (Vivid Hot Pink & Purple) -->
    <linearGradient id="chibiEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff60a0" />
      <stop offset="45%" stop-color="#ff2a85" />
      <stop offset="85%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="chibiRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="chibiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box: Dark Cyber Squircle with Cute Rounded Corners -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#090b12" />
  <rect x="4" y="4" width="92" height="92" rx="26" fill="none" stroke="url(#chibiRim)" stroke-width="2.2" stroke-opacity="0.9" />

  <g transform="translate(6, 6)">
    <!-- Cute Fluffy Tail (Curling up on the right with a pink bow/tip) -->
    <path d="M 58 64 C 76 62 84 48 78 34 C 76 28 69 29 70 35 C 72 44 66 52 56 55 Z" fill="url(#chibiFur)" />
    <path d="M 78 34 C 80 28 73 25 70 33 C 72 30 75 29 76 32 Z" fill="#ff2a85" />

    <!-- Cute Fluffy Cat Ears -->
    <!-- Left Ear -->
    <path d="M 22 36 L 15 10 C 23 13 32 18 37 28 Z" fill="url(#chibiFur)" stroke="#0c0f18" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 22 32 L 18 15 C 23 18 29 22 32 28 Z" fill="url(#chibiPinkEar)" fill-opacity="0.9" />
    <!-- Fluffy Tuft in Ear -->
    <path d="M 23 30 Q 26 27 28 31 Q 25 32 23 30 Z" fill="#ffffff" opacity="0.8" />

    <!-- Right Ear -->
    <path d="M 66 36 L 73 10 C 65 13 56 18 51 28 Z" fill="url(#chibiFur)" stroke="#0c0f18" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 66 32 L 70 15 C 65 18 59 22 56 28 Z" fill="url(#chibiPinkEar)" fill-opacity="0.9" />
    <!-- Fluffy Tuft in Ear -->
    <path d="M 65 30 Q 62 27 60 31 Q 63 32 65 30 Z" fill="#ffffff" opacity="0.8" />

    <!-- Round Chubby Chibi Head -->
    <ellipse cx="44" cy="41" rx="26" ry="21" fill="url(#chibiFur)" />

    <!-- Chubby Cheeks Fluff (Cute Silhouette expansion) -->
    <path d="M 18 43 C 16 48 22 55 31 58 C 36 59.5 44 60 52 58 C 61 55 67 48 65 43 C 68 47 64 54 58 57 C 50 61 38 61 30 57 C 24 54 20 47 18 43 Z" fill="url(#chibiFur)" />

    <!-- Cute Forehead Heart Mark / Highlight -->
    <path d="M 44 24 C 42 21 39 22 39 25 C 39 28 44 31 44 31 C 44 31 49 28 49 25 C 49 22 46 21 44 24 Z" fill="#ff2a85" fill-opacity="0.75" />

    <!-- HUGE SPARKLING KAWAII ANIME EYES -->
    <!-- Left Eye -->
    <ellipse cx="31" cy="39" rx="6.5" ry="8" fill="#080a10" />
    <ellipse cx="31" cy="39.5" rx="5.5" ry="7" fill="url(#chibiEye)" />
    <!-- Big Catchlight Highlight (Top) -->
    <ellipse cx="33" cy="36" rx="2.5" ry="3" fill="#ffffff" />
    <!-- Medium Star Highlight (Bottom right) -->
    <circle cx="29" cy="43" r="1.3" fill="#ffffff" />
    <!-- Tiny Sparkle (Bottom left) -->
    <circle cx="34" cy="42.5" r="0.8" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="57" cy="39" rx="6.5" ry="8" fill="#080a10" />
    <ellipse cx="57" cy="39.5" rx="5.5" ry="7" fill="url(#chibiEye)" />
    <!-- Big Catchlight Highlight (Top) -->
    <ellipse cx="59" cy="36" rx="2.5" ry="3" fill="#ffffff" />
    <!-- Medium Star Highlight (Bottom right) -->
    <circle cx="55" cy="43" r="1.3" fill="#ffffff" />
    <!-- Tiny Sparkle (Bottom left) -->
    <circle cx="60" cy="42.5" r="0.8" fill="#ffffff" />

    <!-- Sweet Anime Blush (Glowing Pink Ovals with cute hatch marks) -->
    <ellipse cx="21" cy="46" rx="4.5" ry="2.2" fill="#ff2a85" fill-opacity="0.45" />
    <line x1="19" y1="45" x2="21" y2="47" stroke="#ff2a85" stroke-width="0.8" stroke-linecap="round" />
    <line x1="22" y1="45" x2="24" y2="47" stroke="#ff2a85" stroke-width="0.8" stroke-linecap="round" />

    <ellipse cx="67" cy="46" rx="4.5" ry="2.2" fill="#ff2a85" fill-opacity="0.45" />
    <line x1="65" y1="45" x2="67" y2="47" stroke="#ff2a85" stroke-width="0.8" stroke-linecap="round" />
    <line x1="68" y1="45" x2="70" y2="47" stroke="#ff2a85" stroke-width="0.8" stroke-linecap="round" />

    <!-- Tiny Cute Pink Button Nose -->
    <ellipse cx="44" cy="44.5" rx="1.8" ry="1.3" fill="#ff7eb6" />

    <!-- Super Cute :3 Kitty Mouth -->
    <path d="M 40.5 46.5 Q 42.5 49 44 47 Q 45.5 49 47.5 46.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Cute Kitty Whiskers (2 gentle curved lines on each side) -->
    <path d="M 14 43 Q 19 44 23 45" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.65" />
    <path d="M 13 47 Q 18 48 23 48" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.65" />

    <path d="M 74 43 Q 69 44 65 45" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.65" />
    <path d="M 75 47 Q 70 48 65 48" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.65" />

    <!-- Cute Collar with Glowing Heart / Bell Charm -->
    <path d="M 33 56 Q 44 61 55 56" stroke="url(#chibiRim)" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <!-- Heart Bell Charm -->
    <path d="M 44 59 C 42.5 57 40 58 40 60 C 40 62.5 44 65 44 65 C 44 65 48 62.5 48 60 C 48 58 45.5 57 44 59 Z" fill="#ff2a85" filter="url(#chibiGlow)" />
    <circle cx="44" cy="61" r="0.8" fill="#ffffff" />

    <!-- Two Little Paws (🐾) Popping Up -->
    <ellipse cx="28" cy="62" rx="4.2" ry="3.2" fill="url(#chibiFur)" stroke="#ff2a85" stroke-width="1" />
    <circle cx="26.5" cy="61.5" r="0.8" fill="#ff7eb6" />
    <circle cx="28" cy="60.5" r="0.8" fill="#ff7eb6" />
    <circle cx="29.5" cy="61.5" r="0.8" fill="#ff7eb6" />
    <ellipse cx="28" cy="63" rx="1.5" ry="1.1" fill="#ff7eb6" />

    <ellipse cx="60" cy="62" rx="4.2" ry="3.2" fill="url(#chibiFur)" stroke="#ff2a85" stroke-width="1" />
    <circle cx="58.5" cy="61.5" r="0.8" fill="#ff7eb6" />
    <circle cx="60" cy="60.5" r="0.8" fill="#ff7eb6" />
    <circle cx="61.5" cy="61.5" r="0.8" fill="#ff7eb6" />
    <ellipse cx="60" cy="63" rx="1.5" ry="1.1" fill="#ff7eb6" />

    <!-- Floating Kawaii Sparkles & Hearts -->
    <!-- Mini Heart (Top Left) -->
    <path d="M 12 25 C 10.5 23 8 24 8 26 C 8 28.5 12 31 12 31 C 12 31 16 28.5 16 26 C 16 24 13.5 23 12 25 Z" fill="#ff2a85" />
    <!-- Sparkle Star (Top Right) -->
    <path d="M 75 20 L 76 22.5 L 78.5 23.5 L 76 24.5 L 75 27 L 74 24.5 L 71.5 23.5 L 74 22.5 Z" fill="#d946ef" />
    <!-- Tiny Sparkle (Bottom) -->
    <path d="M 44 72 L 44.8 74 L 46.8 74.8 L 44.8 75.6 L 44 77.6 L 43.2 75.6 L 41.2 74.8 L 43.2 74 Z" fill="#ff2a85" />
  </g>
</svg>
