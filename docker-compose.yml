services:
  # 1. Database - PostgreSQL (Host: 5433 -> Container: 5432)
  postgres:
    image: postgres:16-alpine
    container_name: nekohentai-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=NekoHentaiDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=NekoHentaiDbPassword2026!
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  # 2. Cache - Redis (Host: 6380 -> Container: 6379)
  redis:
    image: redis:7-alpine
    container_name: nekohentai-redis
    ports:
      - "6380:6379"
    restart: always
    volumes:
      - redis_data:/data

  # 3. Search Engine - Meilisearch (Host: 7701 -> Container: 7700)
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: nekohentai-meilisearch
    ports:
      - "7701:7700"
    environment:
      - MEILI_MASTER_KEY=NekoHentaiMeiliMasterKey2026!
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    restart: always
    volumes:
      - meili_data:/meili_data

  # 4. Backend .NET Web API (Host: 5005 -> Container: 5000)
  api:
    build:
      context: ./backend/MangaFlux.API
      dockerfile: Dockerfile
    container_name: nekohentai-api
    restart: always
    ports:
      - "5005:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=NekoHentaiDb;Username=postgres;Password=NekoHentaiDbPassword2026!;
      - REDIS_CONNECTION_STRING=redis:6379,abortConnect=false
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=NekoHentaiMeiliMasterKey2026!
      - JWT_SECRET=${JWT_SECRET:-NekoHentaiSecretKeyForJwtTokenGeneration2026SuperSecure!}
      - JWT_ISSUER=${JWT_ISSUER:-NekoHentaiAPI}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-NekoHentaiClient}
      - JWT_EXPIRY_DAYS=${JWT_EXPIRY_DAYS:-7}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-510177815251-88f3mqoiatfct4jj0bhnuhmol985ae0s.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - R2_ENDPOINT=${R2_ENDPOINT:-storage.googleapis.com}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-GOOGQHRXVRS7YCR24JBLB33S}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-3Iamo8whmuUeT2B+CMtRnfW6qdIsmwXVec47tF52}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-nekohentai}
      - R2_SECURE=${R2_SECURE:-true}
      - R2_CDN_BASE_URL=${R2_CDN_BASE_URL:-https://img.nekohentai.lol}
    depends_on:
      - postgres
      - redis
      - meilisearch

  # 5. Frontend Angular SPA (Host: 4201 -> Container: 80)
  frontend:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: nekohentai-frontend
    restart: always
    ports:
      - "4201:80"

  # 6. Gateway / Reverse Proxy - Nginx (Host: 80 & 8088 -> Container: 80)
  nginx:
    image: nginx:alpine
    container_name: nekohentai-nginx
    ports:
      - "80:80"
      - "8088:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
      - redis

volumes:
  postgres_data:
  redis_data:
  meili_data:
